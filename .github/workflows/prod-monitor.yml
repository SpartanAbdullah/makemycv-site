# Production monitor for www.makemycv.ae (2026-10-31, session 6 ops).
#
# Once a day and on demand: the 8 post-release checks, sitemap.xml 200 and
# every sitemap URL 200 (scripts/prod-check.mjs), and the checker-count
# contract against the live app endpoint (`npm run check:checklist`, where a
# "skipped" answer counts as a failure here — production must serve it).
# Read-only GET requests; no browser, so nothing reaches GA4.
#
# Alert path: a failed run fails the job (GitHub emails the repo owner about
# failed scheduled runs) AND opens — or comments on — one open issue labelled
# `prod-monitor`. A green run closes that issue with a "recovered" comment.
# Alert drill: `gh workflow run prod-monitor.yml --ref <branch> -f simulate_failure=true`
# adds one fake failing row so the issue + failed-job path can be tested; the
# next normal run closes the issue again.
#
# Scheduling caveat: `schedule:` fires only from the DEFAULT branch (main).
# On `staging` this runs by hand (`gh workflow run prod-monitor.yml --ref
# staging`) and on the push trigger below; the daily run starts once the file
# reaches main in a release. GitHub disables scheduled workflows after 60 days
# without repository activity — re-enable in the Actions tab if that happens.

name: Production monitor

on:
  schedule:
    - cron: "15 4 * * *" # 04:15 UTC = 08:15 UAE, after the app monitor
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Alert drill - add a failing check so the issue path runs
        type: boolean
        default: false
  push:
    branches: [staging]
    paths: [".github/workflows/prod-monitor.yml", "scripts/prod-check.mjs"]

permissions:
  contents: read
  issues: write

concurrency:
  group: prod-monitor
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  ART: monitor-artifacts

jobs:
  monitor:
    name: www.makemycv.ae checks + sitemap + checklist contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: mkdir -p "$ART"

      - name: 8 production checks
        id: checks
        continue-on-error: true
        run: |
          node scripts/prod-check.mjs --checks 2>&1 | tee "$ART/checks.log" && exit 0
          echo "--- retry ---" | tee -a "$ART/checks.log"
          sleep 30
          node scripts/prod-check.mjs --checks 2>&1 | tee -a "$ART/checks.log"

      - name: Sitemap and every sitemap URL answer 200
        id: sitemap
        continue-on-error: true
        run: node scripts/prod-check.mjs --sitemap 2>&1 | tee "$ART/sitemap.log"

      # npm ci only for the contract check (it runs under tsx and imports the
      # site's TypeScript constants).
      - run: npm ci

      - name: Checker checklist contract (live app endpoint)
        id: checklist
        continue-on-error: true
        run: |
          npm run check:checklist 2>&1 | tee "$ART/checklist.log"
          if grep -qi "skipped" "$ART/checklist.log"; then
            echo "The production endpoint did not answer 200 — failing (skips are only for staging)." | tee -a "$ART/checklist.log"
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-monitor-${{ github.run_id }}
          path: ${{ env.ART }}
          retention-days: 14

      - name: Report (summary, issue, job status)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_DRILL: ${{ inputs.simulate_failure }}
          R_CHECKS: ${{ steps.checks.outcome }}
          R_SITEMAP: ${{ steps.sitemap.outcome }}
          R_CHECKLIST: ${{ steps.checklist.outcome }}
        run: |
          rows=(
            "8 production checks|$R_CHECKS|checks.log"
            "sitemap + every URL 200|$R_SITEMAP|sitemap.log"
            "checklist contract|$R_CHECKLIST|checklist.log"
          )
          if [ "$R_DRILL" = true ]; then
            echo "simulate_failure=true: this run only tests the alert path; nothing is wrong." > "$ART/drill.log"
            rows+=("alert drill (simulated, not a real fault)|failure|drill.log")
          fi
          failed=()
          {
            echo "## www.makemycv.ae production monitor"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            for r in "${rows[@]}"; do
              IFS='|' read -r name outcome _ <<< "$r"
              echo "| $name | ${outcome:-not run} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "${rows[@]}"; do
            IFS='|' read -r name outcome log <<< "$r"
            [ "$outcome" = success ] || failed+=("$name|${outcome:-not run}|$log")
          done

          gh label create prod-monitor --color B60205 \
            --description "Opened by the scheduled production monitor" 2>/dev/null || true
          open=$(gh issue list --label prod-monitor --state open --json number --jq '.[0].number // empty')

          if [ ${#failed[@]} -eq 0 ]; then
            echo "All checks passed." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Recovered: all checks passed in $RUN_URL"
              gh issue close "$open"
            fi
            exit 0
          fi

          {
            echo "Production monitor failed on \`${GITHUB_REF_NAME}\` at $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo
            echo "Run: $RUN_URL (full logs in the run artifacts)"
            echo
            for f in "${failed[@]}"; do
              IFS='|' read -r name outcome log <<< "$f"
              echo "### $name: $outcome"
              echo
              echo '```'
              if [ -f "$ART/$log" ]; then
                grep -E '^FAIL|FAIL|skipped|failing' "$ART/$log" | head -n 30 || true
              else
                echo "(no log: the step did not run)"
              fi
              echo '```'
              echo
            done
            echo "Runbook: OPERATIONS_RUNBOOK.md (workspace docs/ai-mission), section 3 Production regression testing."
          } > issue-body.md

          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue-body.md
          else
            gh issue create --title "Production monitor failing: www.makemycv.ae" \
              --label prod-monitor --body-file issue-body.md
          fi
          echo "Failing: ${#failed[@]} check(s)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
